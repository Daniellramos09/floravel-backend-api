spring.application.name=Floravel
server.port=8080

# ===============================
# BANCO DE DADOS MYSQL (floraveldb)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/floraveldb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Formatação de datas em JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

# ===============================
# CONFIGURAÇÃO DE E-MAIL (SMTP)
# ===============================
# Para MAILTRAP (Caixa virtual de testes):
#   spring.mail.host=sandbox.smtp.mailtrap.io
#   spring.mail.port=2525
#   spring.mail.username=seu_user_mailtrap
#   spring.mail.password=sua_pass_mailtrap
#
# Para GMAIL (Envio real via Senha de App):
#   spring.mail.host=smtp.gmail.com
#   spring.mail.port=587
#   spring.mail.username=seu-email@gmail.com
#   spring.mail.password=sua-senha-de-app-16-digitos
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:floravel_mail_user}
spring.mail.password=${SPRING_MAIL_PASSWORD:floravel_mail_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
floravel.mail.from=${FLORAVEL_MAIL_FROM:acolhimento@floravel.com.br}

